# McCurdy Coatings — company settings used on every proposal, invoice and email.
# Fill in the REPLACE_ME values once; everything else reads from here.
company:
  name: McCurdy Coatings
  tagline: Commercial Roof Coatings · Bay Area & Central Valley · Since 1985
  legal_name: Mike McCurdy Roofing Inc.   # McCurdy Coatings is its subsidiary; confirm this matches your CSLB record
  license: "477152"                       # CSLB C-39 Roofing (from mccurdycoatings.com)
  phone: "(650) 952-0233"
  mobile: "(650) 808-5469"
  email: "mccurdycoatings@gmail.com"
  website: "mccurdycoatings.com"
  address: "371 Shaw Rd, South San Francisco, CA 94080"
  service_area: San Francisco Bay Area and Central Valley (40+ Northern California cities)
  signer_name: Mike McCurdy
  signer_title: Owner

# Brand palette (green / blue / white / black)
brand:
  green: "#1E8A4C"      # primary — action, highlights, "renewal"
  green_light: "#E8F5EE"
  blue: "#0F3D6E"       # trust — headers, tables
  blue_bright: "#2B7BC4"
  black: "#0B0F14"
  white: "#FFFFFF"
  gray: "#5B6573"
  gray_light: "#F2F4F7"

# Pricing defaults ($ per sq ft). EDIT the rates to match your real costs and margins.
pricing:
  # Marketing figures (see docs/APPROVED_CLAIMS.md): renewals cost up to this much less than a full
  # replacement by a commercial roofing company; compared against a typical 20-year membrane warranty.
  savings_up_to_percent: 45
  typical_replacement_warranty_years: 20
  systems:
    good:
      name: Silicone Renewal — 10-Year Warranty
      rate: 2.75
      coats: "Primer 1 gal + silicone 1–2 gal per 100 sq ft"
      warranty_years: 10
    better:
      name: Silicone Renewal — 15-Year Warranty
      rate: 3.40
      coats: "Primer 1 gal + silicone 1–2 gal per 100 sq ft"
      warranty_years: 15
    best:
      name: Silicone Renewal — 30-Year NDL Full System
      rate: 4.25
      coats: "Primer 1 gal + base 1–2 gal + contrasting top coat 2–2.5 gal per 100 sq ft"
      warranty_years: 30
  minimum_job: 7500
  # McCurdy standard terms (edit per job in the job file if different)
  payment_schedule:
    - ["No deposit required", 0]
    - ["When materials are loaded on the roof and cleaning & sealing are complete", 50]
    - ["Upon completion of the job", 50]
  proposal_valid_days: 30
  sales_tax_on_materials_percent: 0  # set if you bill tax on materials

invoice:
  payment_terms_days: 15
  late_fee_note: A late fee of 1.5% per month may apply to balances past due.
  accepted_payments: ACH / bank transfer, check, or card (3% card fee)
